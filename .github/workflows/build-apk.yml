# Builds the Mio AI debug APK on a clean runner and uploads it as an artifact.
#
# Gradle task : :app:assembleDebug
# APK output  : app/build/outputs/apk/debug/app-debug.apk
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Secrets hygiene: CI never configures API keys, but redact key-like
          # patterns anyway so credentials can never leak into logs/comments.
          {
            echo "### Build failure diagnostics for ${{ github.sha }}"
            echo '```'
            grep -h -E "^e: |FAILED|What went wrong|Execution failed|Caused by" test.log build.log 2>/dev/null | sed -E 's/sk-[A-Za-z0-9_.-]+/[REDACTED]/g' | head -120 || true
            echo '```'
            echo "Log tail:"
            echo '```'
            { tail -40 test.log 2>/dev/null; tail -40 build.log 2>/dev/null; } | sed -E 's/sk-[A-Za-z0-9_.-]+/[REDACTED]/g'
            echo '```'
          } > diag.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@diag.md || echo "comment post failed"
          grep -h -E "^e: |FAILED|Execution failed" test.log build.log 2>/dev/null | head -8 | while read -r line; do
            echo "::error::$line"
          done || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs
          path: |
            test.log
            build.log
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mio-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
